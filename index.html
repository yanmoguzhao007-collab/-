<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>휴대폰</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#111;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
  #phone{position:relative;width:100%;max-width:420px;height:100dvh;margin:0 auto;background:#000;overflow:hidden;color:#fff}

  /* 상태바 */
  #status{position:absolute;top:0;left:0;right:0;height:24px;background:linear-gradient(#222,#000);
    display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-size:12px;z-index:50;border-bottom:1px solid #333}
  #status .r{display:flex;gap:8px;align-items:center}
  .bars{display:inline-flex;gap:1px;align-items:flex-end;height:11px}
  .bars i{width:3px;background:#9f9;display:block}
  .bars i:nth-child(1){height:3px}.bars i:nth-child(2){height:5px}.bars i:nth-child(3){height:8px}.bars i:nth-child(4){height:11px;background:#555}
  .batt{width:20px;height:10px;border:1px solid #ccc;position:relative}
  .batt:after{content:"";position:absolute;inset:1px 4px 1px 1px;background:#9f9}

  .screen{position:absolute;inset:24px 0 0 0;display:none;flex-direction:column}
  .screen.on{display:flex}

  /* 잠금화면 */
  #lock{background:var(--wall);justify-content:center;align-items:center;text-align:center}
  #lock .time{font-size:72px;font-weight:200;text-shadow:0 2px 6px #000}
  #lock .date{font-size:16px;margin-top:4px;text-shadow:0 1px 3px #000}
  #lock .slide{position:absolute;bottom:50px;width:80%;height:46px;border-radius:24px;background:rgba(0,0,0,.5);
    border:1px solid #888;display:flex;align-items:center;justify-content:center;font-size:14px;color:#ddd}

  /* 홈화면 */
  #home{background:var(--wall)}
  #home .widget{margin:14px;padding:14px;border-radius:8px;background:rgba(0,0,0,.45);text-align:center}
  #home .widget b{font-size:40px;font-weight:300}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 4px;padding:10px 12px}
  .app{display:flex;flex-direction:column;align-items:center;font-size:11px;gap:5px;text-shadow:0 1px 2px #000;cursor:pointer}
  .app .ic{width:54px;height:54px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px;
    background:linear-gradient(#6b6b6b,#2a2a2a);border:1px solid #888;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 4px #000}
  .dock{margin-top:auto;display:flex;justify-content:space-around;padding:10px 0 14px;background:linear-gradient(rgba(0,0,0,.2),rgba(0,0,0,.8))}

  /* 앱 공통 */
  .app-screen{background:#fff;color:#222}
  .bar{height:44px;flex:none;display:flex;align-items:center;gap:10px;padding:0 10px;
    background:linear-gradient(#4a4a4a,#1d1d1d);color:#fff;border-bottom:2px solid #4aa3df;font-size:16px}
  .bar button{background:none;border:0;color:#fff;font-size:20px;cursor:pointer}
  .bar .t{flex:1}
  .body{flex:1;overflow:auto}
  .row{padding:12px 14px;border-bottom:1px solid #ddd;cursor:pointer}
  .row:active{background:#cfe8ff}
  .row .n{font-weight:bold;font-size:15px}
  .row .s{font-size:13px;color:#777;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* 문자 */
  .thread{background:#eef2f5;padding:10px;display:flex;flex-direction:column;gap:8px}
  .bub{max-width:75%;padding:9px 12px;border-radius:12px;font-size:14px;line-height:1.4;position:relative}
  .bub.me{align-self:flex-end;background:#ffe97a;border:1px solid #e6cf55}
  .bub.you{align-self:flex-start;background:#fff;border:1px solid #ccc}
  .bub small{display:block;font-size:10px;color:#888;margin-top:4px}

  /* 메모 */
  .memo{padding:16px;font-size:15px;line-height:1.7;white-space:pre-wrap;
    background:repeating-linear-gradient(#fffbe0,#fffbe0 27px,#e8e0a8 28px)}

  /* 사진 */
  .photos{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:#000}
  .photos div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:40px;background-size:cover;background-position:center;cursor:pointer}
  .viewer{position:absolute;inset:24px 0 0 0;background:#000;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:40}
  .viewer.on{display:flex}
  .viewer .big{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:120px;background-size:cover;background-position:center}
  .viewer p{padding:14px;color:#ddd;font-size:14px;text-align:center}
</style>
</head>
<body>
<div id="phone">
  <div id="status">
    <span id="carrier">KT</span>
    <span class="r"><b style="font-size:11px">3G</b><span class="bars"><i></i><i></i><i></i><i></i></span><span id="clock"></span><span class="batt"></span></span>
  </div>

  <div id="lock" class="screen on"><div class="time" id="lt"></div><div class="date" id="ld"></div><div class="slide">▶ 밀어서 잠금해제</div></div>
  <div id="home" class="screen"></div>
  <div id="app" class="screen app-screen"></div>
  <div id="viewer" class="viewer"></div>
</div>

<script>
/* =====================================================
   ✏️ 여기만 수정하면 됩니다! (이름, 문자, 메모, 사진 등)
   ===================================================== */
const DATA = {
  owner: "차주한",                 // 폰 주인 이름
  carrier: "KT",                   // 통신사 표시
  // 배경화면: 색 그라데이션 또는 이미지 URL  예) "url(wall.jpg)"
  wallpaper: "linear-gradient(160deg,#0b2a4a,#1b6ca8 60%,#0b2a4a)",
  fixedTime: "",                   // "23:47" 처럼 쓰면 시간 고정. 비우면 실제 시간

  contacts: [
    { name: "엄마",   phone: "010-1234-5678" },
    { name: "김민수", phone: "010-2222-3333" },
    { name: "???",    phone: "010-0000-0000" },
  ],

  // 문자: from "me"=주인이 보냄, "you"=상대가 보냄
  messages: [
    { with: "김민수", msgs: [
        { from: "you", text: "야 오늘 몇시에 만나?", time: "오후 3:12" },
        { from: "me",  text: "7시", time: "오후 3:15" },
        { from: "you", text: "ㅇㅋ 늦지마", time: "오후 3:15" },
    ]},
    { with: "엄마", msgs: [
        { from: "you", text: "밥은 먹었니?", time: "오전 11:02" },
        { from: "me",  text: "응 먹었어", time: "오전 11:30" },
    ]},
  ],

  memos: [
    { title: "할 일", text: "- 과제 제출\n- 편의점 알바\n- 생일 선물 사기" },
    { title: "비밀", text: "여기에 비밀 메모를 적으세요.\n줄바꿈도 됩니다." },
  ],

  // 사진: emoji(이모지) 또는 img(이미지 주소) 중 하나 사용
  photos: [
    { emoji: "🌆", caption: "2012.08.14 야경" },
    { emoji: "🐶", caption: "우리집 강아지" },
    { emoji: "🍜", caption: "라면 먹는 중" },
    // { img: "photo1.jpg", caption: "설명" },
  ],
};
/* ===================================================== */

const $ = id => document.getElementById(id);
document.documentElement.style.setProperty("--wall", DATA.wallpaper);
$("carrier").textContent = DATA.carrier;
document.title = DATA.owner + " 휴대폰";

function nowTime(){
  if(DATA.fixedTime) return DATA.fixedTime;
  const d = new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}
function tick(){
  const d = new Date(), w = ["일","월","화","수","목","금","토"];
  $("clock").textContent = nowTime(); $("lt").textContent = nowTime();
  $("ld").textContent = `${d.getMonth()+1}월 ${d.getDate()}일 ${w[d.getDay()]}요일`;
}
tick(); setInterval(tick, 10000);

function show(id){ ["lock","home","app"].forEach(s=>$(s).classList.toggle("on",s===id)); }
$("lock").onclick = () => show("home");

const APPS = [
  { ic:"✉️", name:"메시지", open: openMessages },
  { ic:"📞", name:"연락처", open: openContacts },
  { ic:"📝", name:"메모",   open: openMemos },
  { ic:"🖼️", name:"갤러리", open: openPhotos },
];
const mk = a => `<div class="app" data-n="${a.name}"><div class="ic">${a.ic}</div>${a.name}</div>`;
$("home").innerHTML = `<div class="widget"><b>${nowTime()}</b><div style="font-size:13px;margin-top:4px">${DATA.owner}의 휴대폰</div></div>
  <div class="grid">${APPS.map(mk).join("")}</div>`;
$("home").querySelectorAll(".app").forEach(el=>{
  el.onclick = () => APPS.find(a=>a.name===el.dataset.n).open();
});

function frame(title, bodyHTML, back){
  $("app").innerHTML = `<div class="bar"><button id="bk">◀</button><span class="t">${title}</span><button id="hm">⌂</button></div><div class="body">${bodyHTML}</div>`;
  $("bk").onclick = back || (() => show("home"));
  $("hm").onclick = () => show("home");
  show("app");
}
const esc = s => String(s).replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function openMessages(){
  frame("메시지", DATA.messages.map((m,i)=>{
    const last = m.msgs[m.msgs.length-1];
    return `<div class="row" data-i="${i}"><div class="n">${esc(m.with)}</div><div class="s">${esc(last.text)}</div></div>`;
  }).join(""));
  $("app").querySelectorAll(".row").forEach(r=> r.onclick = () => openThread(+r.dataset.i));
}
function openThread(i){
  const m = DATA.messages[i];
  frame(m.with, `<div class="thread">${m.msgs.map(x=>
    `<div class="bub ${x.from}">${esc(x.text)}<small>${esc(x.time||"")}</small></div>`).join("")}</div>`, openMessages);
}
function openContacts(){
  frame("연락처", DATA.contacts.map(c=>`<div class="row"><div class="n">${esc(c.name)}</div><div class="s">${esc(c.phone)}</div></div>`).join(""));
}
function openMemos(){
  frame("메모", DATA.memos.map((m,i)=>`<div class="row" data-i="${i}"><div class="n">${esc(m.title)}</div><div class="s">${esc(m.text.split("\n")[0])}</div></div>`).join(""));
  $("app").querySelectorAll(".row").forEach(r=> r.onclick = () => {
    const m = DATA.memos[+r.dataset.i];
    frame(m.title, `<div class="memo">${esc(m.text)}</div>`, openMemos);
  });
}
function openPhotos(){
  const bg = p => p.img ? `style="background-image:url('${p.img}')"` : `style="background:#333"`;
  frame("갤러리", `<div class="photos">${DATA.photos.map((p,i)=>`<div data-i="${i}" ${bg(p)}>${p.img?"":p.emoji}</div>`).join("")}</div>`);
  $("app").querySelectorAll(".photos div").forEach(d=> d.onclick = () => {
    const p = DATA.photos[+d.dataset.i];
    $("viewer").innerHTML = `<div class="big" ${bg(p)}>${p.img?"":p.emoji}</div><p>${esc(p.caption||"")}</p>`;
    $("viewer").classList.add("on");
  });
}
$("viewer").onclick = () => $("viewer").classList.remove("on");
</script>
</body>
</html>
